services:
  - type: web
    name: fenix-world-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-world-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false

  - type: worker
    name: fenix-world-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-world-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false

databases:
  - name: fenix-world-db
    databaseName: fenixworld
    user: fenix
